              ].map(function(item, i) {
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, paddingBottom: i < 4 ? 10 : 0, marginBottom: i < 4 ? 10 : 0, borderBottom: i < 4 ? "1px solid " + border : "none" }}>
                    <span style={{ fontSize: 16, minWidth: 28 }}>{item[0]}</span>
                    <span style={{ fontSize: 13, color: textPrimary }}>{item[1]}</span>
                    <span style={{ marginLeft: "auto", color: "#5dd97a", fontSize: 16 }}>✓</span>
                  </div>
                );
              })}
            </div>

            <a href="https://gumroad.com" target="_blank" rel="noopener noreferrer" style={{
              display: "block", textAlign: "center", background: "#f5c842", color: "#0a1220",
              borderRadius: 14, padding: "18px", fontSize: 16, fontWeight: 700, textDecoration: "none",
              marginBottom: 16
            }}>
              Acheter pour 19,99 euros - acces a vie
            </a>

            <div style={{ borderTop: "1px solid " + border, paddingTop: 20, marginTop: 4 }}>
              <div style={{ fontSize: 12, color: textMuted, marginBottom: 10, textAlign: "center" }}>
                Deja un code d'acces ? Entrez-le ici :
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  value={codeInput}
                  onChange={function(e) { setCodeInput(e.target.value.toUpperCase()); setCodeError(""); }}
                  placeholder="Ex: ATTACHE2025"
                  style={{ flex: 1, background: bg, border: "1px solid " + (codeError ? "#e06060" : border), borderRadius: 10, padding: "12px 14px", color: textPrimary, fontSize: 13 }}
                />
                <button onClick={function() { activatePremium(codeInput); }} style={{
                  background: "#f5c842", color: "#0a1220", border: "none", borderRadius: 10,
                  padding: "12px 18px", cursor: "pointer", fontSize: 13, fontWeight: 700
                }}>OK</button>
              </div>
              {codeError && <div style={{ fontSize: 12, color: "#e06060", marginTop: 8 }}>{codeError}</div>}
            </div>
          </div>
        </div>
      )}

      {showStats && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(5,10,18,0.97)", zIndex: 100, overflowY: "auto" }}>
          <div style={{ background: surface, borderBottom: "1px solid " + border, padding: "16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>Mon tableau de bord</div>
            <button onClick={function() { setShowStats(false); }} style={{ background: "none", border: "none", color: "#8899aa", cursor: "pointer", fontSize: 20 }}>x</button>
          </div>
          <div style={{ padding: "20px", maxWidth: 640, margin: "0 auto" }}>
            {(function() {
              var allP = Object.values(progress);
              var totalC = allP.reduce(function(s, p) { return s + p.correct; }, 0);
              var totalT = allP.reduce(function(s, p) { return s + p.total; }, 0);
              var totalS = allP.reduce(function(s, p) { return s + p.sessions; }, 0);
              var globalPct = totalT > 0 ? Math.round((totalC / totalT) * 100) : 0;
              var srsMemo = Object.values(srsData).filter(function(c) { return c.reps >= 3; }).length;
              return (
                <div style={{ background: surface, border: "1px solid " + border, borderRadius: 14, padding: 20, marginBottom: 20 }}>
                  <div style={{ fontSize: 12, color: "#f5c842", fontWeight: 600, marginBottom: 14, textTransform: "uppercase", letterSpacing: "0.06em" }}>Resume global</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
                    {[["Sessions", totalS, "#f5c842"], ["Reussite", globalPct + "%", globalPct >= 70 ? "#5dd97a" : globalPct >= 50 ? "#f5c842" : "#e06060"], ["Questions", totalT, "#ccd5e0"], ["Memorisees", srsMemo, "#5dd97a"], ["Erreurs", wrongBank.length, "#e06060"], ["Favoris", favorites.length, "#f5c842"]].map(function(item, i) {
                      return (
                        <div key={i} style={{ textAlign: "center" }}>
                          <div style={{ fontSize: 22, fontWeight: 700, color: item[2] }}>{item[1]}</div>
                          <div style={{ fontSize: 10, color: "#8899aa", marginTop: 2 }}>{item[0]}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}
            <div style={{ fontSize: 12, color: "#f5c842", fontWeight: 600, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.06em" }}>Par specialite</div>
            {specialites.map(function(s) {
              var p = progress[s.id];
              if (!p) return (
                <div key={s.id} style={{ background: surface, border: "1px solid " + border, borderRadius: 10, padding: "12px 16px", marginBottom: 8, display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 18 }}>{s.emoji}</span>
                  <div style={{ color: "#556677", fontSize: 13 }}>{s.label} - pas encore joue</div>
                </div>
              );
              var pct = Math.round((p.correct / p.total) * 100);
              var bc = pct >= 70 ? "#5dd97a" : pct >= 50 ? "#f5c842" : "#e06060";
              return (
                <div key={s.id} style={{ background: surface, border: "1px solid " + border, borderRadius: 10, padding: "14px 16px", marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                    <span style={{ fontSize: 18 }}>{s.emoji}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, color: "#ccd5e0", fontWeight: 600 }}>{s.label}</div>
                      <div style={{ fontSize: 11, color: "#8899aa" }}>{p.sessions} sessions - meilleur: {p.bestScore}%</div>
                    </div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: bc }}>{pct}%</div>
                  </div>
                  <div style={{ height: 4, background: "#1e2a3a", borderRadius: 2 }}>
                    <div style={{ height: 4, background: bc, borderRadius: 2, width: pct + "%" }} />
                  </div>
                </div>
              );
            })}
            <button onClick={function() {
              localStorage.removeItem("attachePro_progress");
              localStorage.removeItem("attachePro_srs");
              setProgress({});
              setSrsData({});
            }} style={{ marginTop: 20, background: "none", border: "1px solid #334455", color: "#556677", borderRadius: 8, padding: "8px 16px", cursor: "pointer", fontSize: 11 }}>
              Reinitialiser les statistiques
            </button>
          </div>
        </div>
      )}

      {showLegal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(5,10,18,0.97)", zIndex: 100, overflowY: "auto" }}>
          <div style={{ background: surface, borderBottom: "1px solid " + border, padding: "16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>Informations legales</div>
            <button onClick={function() { setShowLegal(false); }} style={{ background: "none", border: "none", color: "#8899aa", cursor: "pointer", fontSize: 20 }}>x</button>
          </div>
          <div style={{ padding: "20px", maxWidth: 640, margin: "0 auto" }}>
            <div style={{ fontSize: 13, color: "#8899aa", lineHeight: 1.8 }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#e8eaf0", marginBottom: 12 }}>Mentions legales</div>
              <p>AttachePro est une application pedagogique de preparation au concours d attache territorial de la Fonction Publique Territoriale.</p>
              <p>Cette application est hebergee sur la plateforme Claude.ai (Anthropic). Les questions sont generees a titre indicatif et ne constituent pas un programme officiel de concours.</p>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#e8eaf0", marginBottom: 12, marginTop: 20 }}>Donnees personnelles</div>
              <p>Aucune donnee personnelle n est collectee ni transmise. Les statistiques de progression sont stockees localement sur votre appareil (localStorage) et ne quittent jamais votre navigateur.</p>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#e8eaf0", marginBottom: 12, marginTop: 20 }}>Avertissement</div>
              <p>AttachePro est un outil complementaire de revision. Il ne garantit pas la reussite au concours. Consultez les programmes officiels du CNFPT et les textes reglementaires en vigueur.</p>
            </div>
          </div>
        </div>
      )}

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: surface, borderTop: "1px solid " + border, display: "flex", zIndex: 50 }}>
        {tabs.map(function(t) {
          return (
            <button key={t.id} onClick={function() { setTab(t.id); }}
              style={{ flex: 1, background: "none", border: "none", padding: "12px 4px 10px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
              <span style={{ fontSize: 20 }}>{t.emoji}</span>
              <span style={{ fontSize: 9, color: tab === t.id ? "#f5c842" : "#556677", letterSpacing: "0.04em" }}>
                {t.label}
              </span>
              {tab === t.id && <div style={{ width: 4, height: 4, borderRadius: "50%", background: "#f5c842" }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}
