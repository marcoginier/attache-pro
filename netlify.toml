 {id:10,date:"2024-2025",categorie:"Social",titre:"Réforme des services d'aide à domicile (SAAD) et virage domiciliaire",contenu:"Le 'virage domiciliaire' consiste à privilégier le maintien à domicile des personnes âgées ou handicapées, considéré moins coûteux et plus conforme aux souhaits des personnes. La loi de financement de la Sécurité Sociale renforce les financements du domicile. Les SAAD sont au coeur de cette politique mais font face à des difficultés de recrutement et de financement. Les départements doivent piloter ce virage, en partenariat avec les ARS et les EPCI.",chiffres_cles:["70% des personnes âgées souhaitent rester à domicile", "Coût moyen en EHPAD : 2 500 euros/mois (reste à charge moyen : 1 850 euros)", "100 000 aides à domicile manquantes d'ici 2030"]},
