          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16 }}>
            <button onClick={function() { toggleFav(q.id); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20 }}>
              {isFav ? "★" : "☆"}
            </button>
            <div style={{ fontSize: 11, color: "#556677" }}>Score: {score}/{currentQ + (selected !== null ? 1 : 0)}</div>
          </div>
        </div>
      </div>
    );
  }

  // ============================================================
  // RESULTS VIEW
  // ============================================================
  if (quizState && quizState.finished) {
    var pctScore = Math.round((score / quizState.questions.length) * 100);
    var color = pctScore >= 70 ? "#5dd97a" : pctScore >= 50 ? "#f5c842" : "#e06060";
    var wrongAnswers = answers.filter(function(a) { return !a.correct; });
    return (
      <div style={{ minHeight: "100vh", background: bg, color: textPrimary, fontFamily: "Georgia, serif", paddingBottom: 40 }}>
