          {showExplanation && q.explanation && (
            <div style={{ background: "#0d1f2d", border: "1px solid #1e3a4a", borderRadius: 10, padding: "14px 16px", marginTop: 8 }}>
              <div style={{ fontSize: 11, color: "#f5c842", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>Explication</div>
              <div style={{ fontSize: 13, color: "#ccd5e0", lineHeight: 1.5 }}>{q.explanation}</div>
