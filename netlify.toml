const normalizeQ = function(q) {
  if (!q) return q;
  if (q.question !== undefined) return q;
  return { id: q.id, bloc: q.b, question: q.q, options: q.o, answer: q.a, explanation: q.e };
};

const generateQuestions = async function(label, bloc, existing, count) {
  var n = count || 15;
  try {
    var r = await fetch("/.netlify/functions/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label: label, bloc: bloc, existing: existing, count: n })
    });
    var d = await r.json();
    if (!d.questions) return [];
    return d.questions;
  } catch(e) {
    console.error("Erreur generation:", e);
    return [];
  }
};

export default function AttachePro() {

  // --- ETATS ---
  var [tab, setTab] = useState("specialites");
  var [selectedSpecialite, setSelectedSpecialite] = useState(null);
  var [selectedOral, setSelectedOral] = useState(null);
  var [selectedActu, setSelectedActu] = useState(null);
  var [selectedMethodo, setSelectedMethodo] = useState(null);
  var [quizState, setQuizState] = useState(null);
  var [currentQ, setCurrentQ] = useState(0);
  var [selected, setSelected] = useState(null);
  var [showExplanation, setShowExplanation] = useState(false);
  var [score, setScore] = useState(0);
  var [answers, setAnswers] = useState([]);
  var [filterBloc, setFilterBloc] = useState("Tous");
  var [searchQuery, setSearchQuery] = useState("");
  var [examMode, setExamMode] = useState(false);
  var [timerSeconds, setTimerSeconds] = useState(0);
  var [timerActive, setTimerActive] = useState(false);
  var [favorites, setFavorites] = useState(function() {
    try { return JSON.parse(localStorage.getItem("attachePro_fav") || "[]"); } catch(e) { return []; }
  });
  var [wrongBank, setWrongBank] = useState(function() {
    try { return JSON.parse(localStorage.getItem("attachePro_wrong") || "[]"); } catch(e) { return []; }
  });
  var [progress, setProgress] = useState(function() {
    try { return JSON.parse(localStorage.getItem("attachePro_progress") || "{}"); } catch(e) { return {}; }
  });
  var [srsData, setSrsData] = useState(function() {
    try { return JSON.parse(localStorage.getItem("attachePro_srs") || "{}"); } catch(e) { return {}; }
  });
  var [extraQs, setExtraQs] = useState({});
  var [loadingAPI, setLoadingAPI] = useState(false);
  var [lastGenCount, setLastGenCount] = useState(0);
  var [showStats, setShowStats] = useState(false);
  var [showLegal, setShowLegal] = useState(false);
  var [isPremium, setIsPremium] = useState(function() {
    try { return localStorage.getItem("ap_premium") === "true"; } catch(e) { return false; }
  });
  var [showPaywall, setShowPaywall] = useState(false);
  var [codeInput, setCodeInput] = useState("");
  var [codeError, setCodeError] = useState("");

  // Codes d'accès premium valides
  var VALID_CODES = ["ATTACHE2025", "PREMIUM2025", "FPT2025PRO", "CONCOURS25"];

  function activatePremium(code) {
    if (VALID_CODES.indexOf(code.trim().toUpperCase()) >= 0) {
      setIsPremium(true);
      try { localStorage.setItem("ap_premium", "true"); } catch(e) {}
      setShowPaywall(false);
      setCodeInput("");
      setCodeError("");
    } else {
      setCodeError("Code invalide. Verifiez votre email de confirmation.");
    }
  }

  // Spécialités accessibles en gratuit
  var FREE_SPECS = ["admin", "cg"];
  function isAccessible(specId) {
    return isPremium || FREE_SPECS.indexOf(specId) >= 0;
  }
  var [legalPage, setLegalPage] = useState("mentions");
  var [darkMode, setDarkMode] = useState(function() {
    try { return localStorage.getItem("ap_dark") !== "false"; } catch(e) { return true; }
  });

  function toggleDark() {
    setDarkMode(function(prev) {
      var next = !prev;
      try { localStorage.setItem("ap_dark", String(next)); } catch(e) {}
      return next;
    });
  }

  var bg = darkMode ? "#0d1520" : "#f0f4f8";
  var surface = darkMode ? "#111d2e" : "#ffffff";
  var border = darkMode ? "#1e2a3a" : "#dde3ec";
  var textPrimary = darkMode ? "#e8eaf0" : "#1a2332";
  var textMuted = darkMode ? "#8899aa" : "#556677";
  var textSubtle = darkMode ? "#556677" : "#8899aa";

  // --- TIMER ---
  var timerRef = useRef(null);
  useEffect(function() {
    if (timerActive) {
      timerRef.current = setInterval(function() { setTimerSeconds(function(s) { return s + 1; }); }, 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return function() { clearInterval(timerRef.current); };
  }, [timerActive]);

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ":" + (sec < 10 ? "0" : "") + sec;
  }

  // --- QUESTIONS ---
  function getQs(spec) {
    if (!spec) return [];
    return (spec.seeds || []).concat(extraQs[spec.id] || []);
  }

  function loadMore(spec, bloc) {
    if (loadingAPI || !spec) return;
    setLoadingAPI(true);
    var cur = getQs(spec);
    generateQuestions(spec.label, bloc && bloc !== "Tous" ? bloc : null, cur, 15).then(function(newQs) {
      if (newQs.length > 0) {
        setExtraQs(function(prev) {
          var next = Object.assign({}, prev);
          next[spec.id] = (prev[spec.id] || []).concat(newQs);
          return next;
        });
        setFilterBloc("Tous");
        setLastGenCount(newQs.length);
        setLoadingAPI(false);
      } else {
        setLoadingAPI(false);
      }
    }).catch(function() { setLoadingAPI(false); });
  }

  function getDueQs(questions) {
    var now = Date.now();
    return questions.map(normalizeQ).filter(function(q) {
      var card = srsData[q.id + "_" + q.bloc];
      return !card || card.due <= now;
    });
  }

  var blocs = selectedSpecialite
    ? ["Tous"].concat(Array.from(new Set(
        (selectedSpecialite.seeds || []).concat(extraQs[selectedSpecialite.id] || [])
          .map(function(q) { return q.bloc || q.b; })
      )))
    : [];

  var allSpecQs = selectedSpecialite
    ? (selectedSpecialite.seeds || []).concat(extraQs[selectedSpecialite.id] || [])
    : [];
  var filteredQs = allSpecQs.filter(function(q) {
    var nq = q.question !== undefined ? q : { question: q.q, bloc: q.b };
    return (filterBloc === "Tous" || (q.bloc || q.b) === filterBloc) &&
      (searchQuery === "" || nq.question.toLowerCase().indexOf(searchQuery.toLowerCase()) >= 0);
  });

  // --- QUIZ ---
  function startQuiz(questions, isExam) {
    var count = isExam ? 40 : 20;
    var shuffled = questions.slice().sort(function() { return Math.random() - 0.5; })
      .slice(0, Math.min(count, questions.length))
      .map(normalizeQ);
    setQuizState({ questions: shuffled });
    setExamMode(!!isExam);
    setCurrentQ(0);
    setSelected(null);
    setShowExplanation(false);
    setScore(0);
    setAnswers([]);
    setTimerSeconds(0);
    setTimerActive(true);
  }

  function handleAnswer(idx) {
    if (selected !== null) return;
    var q = quizState.questions[currentQ];
    var correct = idx === q.answer;
    // SRS update
    setSrsData(function(prev) {
      var key = q.id + "_" + q.bloc;
      var card = prev[key] || { due: Date.now(), interval: 1, ease: 2.5, reps: 0 };
      var interval = card.interval;
      var ease = card.ease;
      var reps = card.reps;
      if (correct) {
        reps += 1;
        interval = reps === 1 ? 1 : reps === 2 ? 6 : Math.round(interval * ease);
        ease = Math.min(3.0, ease + 0.1);
      } else {
        reps = 0; interval = 1; ease = Math.max(1.3, ease - 0.2);
      }
      var next = Object.assign({}, prev);
      next[key] = { due: Date.now() + interval * 86400000, interval: interval, ease: ease, reps: reps };
      try { localStorage.setItem("attachePro_srs", JSON.stringify(next)); } catch(e) {}
      return next;
    });
    if (examMode) {
      if (correct) setScore(function(s) { return s + 1; });
      else saveWrong(q);
      setAnswers(function(a) { return a.concat([{ q: q, chosen: idx, correct: correct }]); });
      setTimeout(function() {
        if (currentQ + 1 >= quizState.questions.length) {
          setTimerActive(false);
          setQuizState(function(prev) { return Object.assign({}, prev, { finished: true }); });
        } else {
          setCurrentQ(function(c) { return c + 1; });
          setSelected(null);
        }
      }, 300);
      setSelected(idx);
      return;
    }
    setSelected(idx);
    setShowExplanation(true);
    if (correct) setScore(function(s) { return s + 1; });
    else saveWrong(q);
    setAnswers(function(a) { return a.concat([{ q: q, chosen: idx, correct: correct }]); });
  }

  function nextQ() {
    if (currentQ + 1 >= quizState.questions.length) {
      setTimerActive(false);
      var specId = selectedSpecialite ? selectedSpecialite.id : null;
      setProgress(function(prev) {
        var key = specId || "mixed";
        var ex = prev[key] || { sessions: 0, correct: 0, total: 0, bestScore: 0 };
        var next = Object.assign({}, prev);
        next[key] = {
          sessions: ex.sessions + 1,
          correct: ex.correct + score,
          total: ex.total + quizState.questions.length,
          bestScore: Math.max(ex.bestScore, Math.round((score / quizState.questions.length) * 100)),
          lastPlayed: Date.now()
        };
        try { localStorage.setItem("attachePro_progress", JSON.stringify(next)); } catch(e) {}
        return next;
      });
      setQuizState(function(q) { return Object.assign({}, q, { finished: true }); });
    } else {
      setCurrentQ(function(c) { return c + 1; });
      setSelected(null);
      setShowExplanation(false);
    }
  }

  function toggleFav(qId) {
    setFavorites(function(prev) {
      var next = prev.indexOf(qId) >= 0 ? prev.filter(function(id) { return id !== qId; }) : prev.concat([qId]);
      try { localStorage.setItem("attachePro_fav", JSON.stringify(next)); } catch(e) {}
      return next;
    });
  }

  function saveWrong(q) {
    setWrongBank(function(prev) {
      if (prev.find(function(w) { return w.id === q.id && w.bloc === q.bloc; })) return prev;
      var next = prev.concat([q]).slice(-100);
      try { localStorage.setItem("attachePro_wrong", JSON.stringify(next)); } catch(e) {}
      return next;
    });
  }

  // ============================================================
  // QUIZ VIEW
  // ============================================================
  if (quizState && !quizState.finished) {
    var q = quizState.questions[currentQ];
    var pct = (currentQ / quizState.questions.length) * 100;
    var isFav = favorites.indexOf(q.id) >= 0;
    return (
      <div style={{ minHeight: "100vh", background: bg, color: textPrimary, fontFamily: "Georgia, serif" }}>
        <div style={{ background: "#111d2e", padding: "12px 16px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={function() { setTimerActive(false); setQuizState(null); }} style={{ background: "none", border: "none", color: "#8899aa", cursor: "pointer", fontSize: 13 }}>Quitter</button>
          <div style={{ flex: 1, height: 3, background: "#1e2a3a", borderRadius: 2 }}>
            <div style={{ height: 3, background: "#f5c842", borderRadius: 2, width: pct + "%" }} />
          </div>
          <div style={{ fontSize: 12, color: "#8899aa" }}>{currentQ + 1}/{quizState.questions.length}</div>
          <div style={{ fontSize: 12, color: timerSeconds > 2400 ? "#e06060" : "#8899aa" }}>{formatTime(timerSeconds)}</div>
        </div>

        <div style={{ padding: "20px", maxWidth: 640, margin: "0 auto" }}>
          <div style={{ fontSize: 11, color: "#556677", marginBottom: 8 }}>
            {q.bloc}
          </div>

          <div style={{ fontSize: 16, fontWeight: 600, color: "#e8eaf0", marginBottom: 24, lineHeight: 1.5 }}>
            {q.question}
          </div>

          {q.options.map(function(opt, i) {
            var bg = "#111d2e";
            var border = "#1e2a3a";
            var color = "#ccd5e0";
            if (selected !== null) {
              if (i === q.answer) { bg = "#0d2d1a"; border = "#5dd97a"; color = "#5dd97a"; }
