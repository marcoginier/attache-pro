                    <div style={{ fontSize: 12, color: "#e06060", marginBottom: 4 }}>Votre reponse: {a.q.options[a.chosen]}</div>
                    <div style={{ fontSize: 12, color: "#5dd97a" }}>Bonne reponse: {a.q.options[a.q.answer]}</div>
                    {a.q.explanation && (
                      <div style={{ fontSize: 12, color: "#8899aa", marginTop: 8, fontStyle: "italic" }}>{a.q.explanation}</div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ============================================================
  // SPECIALITE DETAIL
  // ============================================================
  if (selectedSpecialite) {
    var specQs = allSpecQs;
    var dueQs = getDueQs(allSpecQs);
    var specProgress = progress[selectedSpecialite.id];
    return (
      <div style={{ minHeight: "100vh", background: bg, color: textPrimary, fontFamily: "Georgia, serif", paddingBottom: 40 }}>
        <div style={{ background: surface, borderBottom: "1px solid " + border, padding: "16px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={function() { setSelectedSpecialite(null); setFilterBloc("Tous"); setSearchQuery(""); }}
            style={{ background: "none", border: "none", color: "#8899aa", cursor: "pointer", fontSize: 18 }}>
            Retour
          </button>
          <div>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#e8eaf0" }}>{selectedSpecialite.emoji} {selectedSpecialite.label}</div>
            <div style={{ fontSize: 11, color: "#556677" }}>{allSpecQs.length} questions disponibles</div>
          </div>
        </div>

        <div style={{ padding: "16px 20px", maxWidth: 640, margin: "0 auto" }}>
          {specProgress && (
            <div style={{ background: surface, border: "1px solid " + border, borderRadius: 12, padding: "14px 16px", marginBottom: 14, display: "flex", justifyContent: "space-around" }}>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#f5c842" }}>{specProgress.bestScore}%</div>
                <div style={{ fontSize: 10, color: "#8899aa" }}>meilleur</div>
              </div>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#5dd97a" }}>{specProgress.sessions}</div>
                <div style={{ fontSize: 10, color: "#8899aa" }}>sessions</div>
              </div>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#ccd5e0" }}>{specProgress.total > 0 ? Math.round((specProgress.correct / specProgress.total) * 100) : 0}%</div>
                <div style={{ fontSize: 10, color: "#8899aa" }}>reussite</div>
              </div>
            </div>
