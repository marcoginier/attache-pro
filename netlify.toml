 {id:5,date:"2024-2025",categorie:"Numérique",titre:"Intelligence artificielle dans les collectivités locales",contenu:"Le règlement européen sur l'intelligence artificielle (IA Act, 2024) crée un cadre de régulation des systèmes d'IA par niveaux de risque. Les collectivités territoriales commencent à expérimenter l'IA dans des domaines comme la gestion des demandes des usagers (chatbots), la détection de fraude fiscale, la maintenance prédictive des équipements ou la gestion de l'énergie. Des questions éthiques et RGPD se posent (biais algorithmiques, droits des administrés, explicabilité des décisions).",chiffres_cles:["IA Act européen adopté en 2024", "Expérimentations en cours dans plusieurs métropoles", "Enjeux RGPD et éthique à maîtriser"]},
