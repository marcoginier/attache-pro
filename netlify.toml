const questionsPieges = [
 {id:1,q:"Quelle est la différence entre un arrêté et une délibération ?",reponse:"L'arrêté est un acte unilatéral pris par le maire (ou le président de l'EPCI) seul, dans l'exercice de ses attributions propres (police administrative, exécution des délibérations, gestion des agents...). La délibération est un acte collégial voté par l'assemblée délibérante (conseil municipal, communautaire...) sur les affaires relevant de sa compétence (budget, règlements locaux, conventions importantes, cessions de biens...)."},
 {id:2,q:"Qu'est-ce que la règle d'or des finances locales et en quoi se distingue-t-elle de celle de l'État ?",reponse:"La règle d'or des finances locales (CGCT) impose que les budgets soient votés en équilibre réel : les recettes réelles de fonctionnement couvrent les dépenses réelles de fonctionnement, et l'emprunt ne peut financer que l'investissement. La France n'a pas de règle d'or constitutionnelle équivalente pour les finances de l'État, même si les engagements européens (Traité sur la stabilité, coordination et gouvernance - TSCG) imposent un objectif de déficit structurel limité."},
 {id:3,q:"Quelle est la différence entre décentralisation et déconcentration ?",reponse:"La décentralisation transfère des compétences et des ressources à des collectivités territoriales dotées d'une personnalité juridique propre et d'une légitimité démocratique (élus au suffrage universel). Elles s'administrent librement. La déconcentration consiste pour l'État à déléguer des pouvoirs de décision à des représentants locaux (préfets, recteurs, DREAL...) qui restent soumis à la hiérarchie de l'État central. Dans la déconcentration, c'est 'le même marteau qui frappe, mais on en a raccourci le manche' (Odilon Barrot)."},
 {id:4,q:"Peut-on être à la fois fonctionnaire et mandataire local (conseiller municipal, par exemple) ?",reponse:"Oui, un fonctionnaire peut exercer un mandat électif local (conseiller municipal, conseiller départemental, régional). Il bénéficie de droits spécifiques (crédits d'heures pour l'exercice du mandat, autorisations d'absence). En revanche, il est soumis à des obligations renforcées de neutralité et de réserve dans l'exercice de ses fonctions, et ne peut pas utiliser ses prérogatives professionnelles au bénéfice de son mandat."},
 {id:5,q:"Quelle est la différence entre un EPCI à fiscalité propre et un syndicat intercommunal ?",reponse:"Un EPCI à fiscalité propre (communauté de communes, d'agglomération, métropole) perçoit directement ses propres ressources fiscales (CFE, taxes ménagères) et exerce des compétences intégrées sur un bloc cohérent de politiques publiques. Un syndicat intercommunal (SIVU, SIVOM, syndicat mixte) est financé par des contributions des membres (pas de fiscalité propre) et est créé pour gérer un ou plusieurs services spécifiques (eau, déchets, transport scolaire...). Il peut regrouper des collectivités de niveaux différents (syndicat mixte)."},
 {id:6,q:"Qu'est-ce que le principe de précaution et où est-il inscrit dans le droit français ?",reponse:"Le principe de précaution permet aux autorités publiques de prendre des mesures pour prévenir des risques graves et irréversibles, même en l'absence de certitude scientifique établie sur l'existence de ces risques. En droit français, il est inscrit à l'article 5 de la Charte de l'environnement, qui a valeur constitutionnelle depuis 2005. Il ne doit pas être confondu avec le principe de prévention (qui s'applique quand le risque est scientifiquement établi)."},
 {id:7,q:"Quels sont les trois 'lois de Rolland' régissant les services publics ?",reponse:"Les trois lois de Rolland (ou principes fondamentaux des services publics) sont : la continuité (le service public doit fonctionner de manière régulière et continue, ce qui justifie l'encadrement du droit de grève), l'égalité (tous les usagers ont droit au même service dans des conditions similaires, sans discrimination) et l'adaptabilité ou mutabilité (le service public doit évoluer pour s'adapter aux besoins des usagers et aux impératifs d'intérêt général). Certains auteurs ajoutent la neutralité et la laïcité comme principes complémentaires."},
 {id:8,q:"Quelle est la différence entre une faute de service et une faute personnelle d'un agent public ?",reponse:"La faute de service est une faute commise par un agent dans l'exercice de ses fonctions, engageant la responsabilité de la collectivité (réparation par la collectivité). La faute personnelle est détachable du service : elle révèle l'homme avec ses faiblesses, passions ou intérêts privés (faute intentionnelle, comportement grossier, acte accompli dans un intérêt personnel). Elle peut engager la responsabilité personnelle de l'agent devant le juge judiciaire, même si la collectivité peut être appelée en garantie dans certains cas."},
];

